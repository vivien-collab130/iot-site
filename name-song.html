<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Song Machine</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; background: #1b1035; color: #fff; }
  h1   { margin-bottom: 4px; font-size: 2.2rem; }
  .sub { color: #c9b8ff; margin-top: 0; }
  .card { background: #fff; color: #222; border-radius: 16px; padding: 24px; margin: 16px 0; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .namebox { font-size: 1.5rem; padding: 14px; border: 2px solid #ccc; border-radius: 10px; width: 100%; box-sizing: border-box; margin: 8px 0 12px; }
  .play { font-size: 1.4rem; padding: 14px 28px; border: 0; border-radius: 10px; cursor: pointer; color: #fff; background: #7b3fe4; width: 100%; }
  .small { color: #666; font-size: .95rem; margin-top: 10px; }
  .tiny  { color: #c9b8ff; font-size: .85rem; }
  .tiny a { color: #c9b8ff; }
</style>
</head>
<body>

<h1>🎵 Name Song Machine</h1>
<p class="sub">Type a name and hear what it sounds like!</p>

<div class="card">
  <input class="namebox" id="nameBox" type="text" maxlength="12" placeholder="Type a name...">
  <button class="play" onclick="sendName()">▶ Play my name</button>
  <div class="small" id="nameStatus"></div>
</div>

<p class="tiny">Adafruit IO user: <span id="whoami">?</span> &nbsp;|&nbsp; <a href="#" id="changeKey">change key</a></p>

<script>
/* ---------- SETTINGS ---------- */
const IO_USERNAME = "eagle_vivien";   // your Adafruit IO username
const LAMP_FEED   = "lamp";           // the feed the Arduino listens to

/* ---------- KEY (stays in this browser only, never in this file) ---------- */
function getKey() {
  let key = null;
  try { key = localStorage.getItem("aio_key"); } catch (e) {}
  if (!key) {
    key = prompt("Paste your Adafruit IO key (starts with aio_). It stays in this browser only.");
    if (key) { try { localStorage.setItem("aio_key", key.trim()); } catch (e) {} }
  }
  return key ? key.trim() : "";
}
document.getElementById("changeKey").onclick = (e) => {
  e.preventDefault();
  try { localStorage.removeItem("aio_key"); } catch (e2) {}
  location.reload();
};

const IO_KEY = getKey();
document.getElementById("whoami").textContent = IO_USERNAME;
const BASE = `https://io.adafruit.com/api/v2/${IO_USERNAME}/feeds/`;

/* ---------- SEND THE NAME ---------- */
async function sendName() {
  const box = document.getElementById("nameBox");
  const status = document.getElementById("nameStatus");
  const name = box.value.trim();

  if (!name) { status.textContent = "Type a name first!"; return; }

  status.textContent = "Sending '" + name + "'...";
  try {
    const res = await fetch(BASE + LAMP_FEED + "/data", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-AIO-Key": IO_KEY },
      body: JSON.stringify({ value: "name:" + name })
    });
    if (res.status === 401) { status.textContent = "Wrong key. Click 'change key' below."; return; }
    if (res.status === 429) { status.textContent = "Slow down! Wait a few seconds and try again."; return; }
    if (!res.ok) { status.textContent = "Adafruit IO replied " + res.status; return; }
    status.textContent = "Sent '" + name + "' at " + new Date().toLocaleTimeString();
    box.value = "";
  } catch (err) {
    status.textContent = "Could not send: " + err.message;
  }
}

// Pressing Enter works too
document.getElementById("nameBox").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendName();
});
</script>
</body>
</html>
